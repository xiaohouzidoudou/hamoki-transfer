# Dev testing site intentionally offline. Existing websites remain unaffected.
# Keep only HTTP-01 challenge for Let's Encrypt certificate renewal.
server {
    listen 80;
    server_name dev.2858888.xyz;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/dev.2858888.xyz/index;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 444; }
}
server {
    listen 443 ssl;
    server_name dev.2858888.xyz;
    access_log off;
    ssl_certificate /www/sites/dev.2858888.xyz/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/dev.2858888.xyz/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 444; }
}
