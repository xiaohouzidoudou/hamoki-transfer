name: Retire unused GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  retire-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Prepare retired site without index
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>404 - Not Found</title><body><h1>404 - Not Found</h1><p>This temporary preview is retired.</p></body></html>' > _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
