name: Publish versioned GitHub Release

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - RELEASE_NOTES.md
      - CHANGELOG.md
      - tests/**
      - .github/workflows/publish-release.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - RELEASE_NOTES.md
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'xiaohouzidoudou/hamoki-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check private browser JavaScript syntax
        run: node --check static/private.js

  release:
    needs: validate
    if: github.repository == 'xiaohouzidoudou/hamoki-transfer' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4
      - name: Publish if version is not released yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already exists; no duplicate release created."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "好奇猴快传 $tag" \
            --notes-file RELEASE_NOTES.md
          echo "Published $tag"
